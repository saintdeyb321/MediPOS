name: B-02 isolated browser pilot

on:
  workflow_dispatch:
  push:
    branches:
      - ci/postgres-diagnostics-8bc6b4c
    paths:
      - .github/workflows/b02-browser-pilot.yml
      - 'backend/tests/MediPOS.E2E/**'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NuGetAudit: 'true'
      NuGetAuditMode: all
      NuGetAuditLevel: low
      TreatWarningsAsErrors: 'true'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.18.1'
          package-manager-cache: false
      - name: Pin tools and verify checkout
        working-directory: backend
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = 'v24.18.1'
          test ! -e global.json && test ! -L global.json
          set -o noclobber
          printf '%s\n' '{"sdk":{"version":"10.0.402","rollForward":"disable","allowPrerelease":false}}' > global.json
          test "$(dotnet --version)" = '10.0.402'
          test -S /var/run/docker.sock
          docker --host unix:///var/run/docker.sock info --format '{{.ServerVersion}}'
      - name: Build React from locked dependencies
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --outDir "$RUNNER_TEMP/medipos-b02-build"
      - name: Build isolated test project and install Chromium
        working-directory: backend
        run: |
          dotnet restore tests/MediPOS.E2E/MediPOS.E2E.csproj --locked-mode
          dotnet build tests/MediPOS.E2E/MediPOS.E2E.csproj --no-restore
          pwsh tests/MediPOS.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run preflight and P0–P5
        working-directory: backend
        run: |
          export MEDIPOS_E2E_SHA="$GITHUB_SHA"
          export MEDIPOS_E2E_BUILD="$RUNNER_TEMP/medipos-b02-build"
          report="$(mktemp)"
          trap 'rm -f -- "$report"' EXIT
          code=0
          dotnet tests/MediPOS.E2E/bin/Debug/net10.0/MediPOS.E2E.dll -showLiveOutput >"$report" 2>&1 || code=$?
          awk '
            match($0, /B02 SHA [a-fA-F0-9]{40} BUILD [a-f0-9]{64}$/) ||
            match($0, /B02 POSTGRES 18[0-9]{4} ORIGIN https:\/\/localhost:[0-9]{1,5} ROLE medipos_test_runtime$/) ||
            match($0, /B02 P[0-5] START$/) ||
            match($0, /B02 P[0-2] PASS$/) ||
            match($0, /B02 P3 PASS CASH_HISTORY_AND_RECOVERY$/) ||
            match($0, /B02 P4 PASS POS_PAY_TICKET_VOID$/) ||
            match($0, /B02 P5 PASS CATALOG_SEARCH_WRITE_IMPORT$/) ||
            match($0, /B02 P5 DIAG (SEED|SEARCH|CREATE|EDIT|ASSOCIATION|IMPORT|PERSISTENCE) (START|PASS)$/) ||
            match($0, /B02 P5 DIAG SEED FAIL (ACTORS|PRODUCTS|FOREIGN_TENANT|SESSIONS)$/) ||
            match($0, /B02 P5 DIAG SEARCH FAIL (DEFAULT_PAGE|INGREDIENT_UI|LITERAL_FILTERS|PERMISSIONS|CLEAR|FOREIGN_DIRECTORY)$/) ||
            match($0, /B02 P5 DIAG CREATE FAIL (FORM|POST_LOST_ACK|REENTRY|RECONCILIATION)$/) ||
            match($0, /B02 P5 DIAG CREATE FAIL (PREFLIGHT|REVIEW|CLICK|COUNTS|NO_POST|NO_INTERCEPTION|UPSTREAM_REJECT|RESPONSE_CONTRACT|ACK_ABORT|UI_PENDING|PERSISTENCE|INDETERMINADA)$/) ||
            match($0, /B02 P5 CREATE (CLICK DONE|GUARD PENDING|ID (VALID|INVALID)|ABORT (DONE|FAILED)|DISPOSE FAILED|READ FAILED)$/) ||
            match($0, /B02 P5 CREATE UPSTREAM (201|400|401|403|409|429|5XX|OTHER)$/) ||
            match($0, /B02 P5 CREATE POST (0|1|MANY) INTERCEPT (0|1|MANY)$/) ||
            match($0, /B02 P5 CREATE READ (BEFORE|AFTER_RESPONSE|INCONCLUSIVE) PRODUCTS (0|1|MANY) AUDIT (0|1|MANY) OWNER (0|1|MANY) LOTS (0|1|MANY) MOVES (0|1|MANY) MATCH (YES|NO|UNKNOWN)$/) ||
            match($0, /B02 P5 DIAG EDIT FAIL (METADATA|STALE_REVISION|PRICES|UNITS|LEGACY_UNITS|STATUS)$/) ||
            match($0, /B02 P5 DIAG ASSOCIATION FAIL (FORM|POST|READ_ONLY_REFERENCE)$/) ||
            match($0, /B02 P5 DIAG IMPORT FAIL (TEMPLATE|WORKBOOK|POST_LOST_ACK|RECEIPT|PAGINATION|PERMISSIONS|COMPLETE)$/) ||
            match($0, /B02 P5 DIAG PERSISTENCE FAIL (RLS|LOCAL_AND_LINKED|UNITS|IMPORT_ROWS|AUDIT|NO_STOCK|CLEANUP)$/) { print substr($0, RSTART, RLENGTH) }
          ' "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$code" -ne 0 ]]; then
            printf '%s\n' 'B-02 failed or was incomplete. Unreported phases are unverified.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
          grep -Eq "^B02 SHA $GITHUB_SHA BUILD [a-f0-9]{64}$" "$GITHUB_STEP_SUMMARY"
          grep -Eq '^B02 POSTGRES 18[0-9]{4} ORIGIN https://localhost:[0-9]{1,5} ROLE medipos_test_runtime$' "$GITHUB_STEP_SUMMARY"
          for phase in 0 1 2; do
            grep -Fxq "B02 P$phase PASS" "$GITHUB_STEP_SUMMARY"
          done
          grep -Fxq 'B02 P3 PASS CASH_HISTORY_AND_RECOVERY' "$GITHUB_STEP_SUMMARY"
          grep -Fxq 'B02 P4 PASS POS_PAY_TICKET_VOID' "$GITHUB_STEP_SUMMARY"
          grep -Fxq 'B02 P5 START' "$GITHUB_STEP_SUMMARY"
          grep -Fxq 'B02 P5 PASS CATALOG_SEARCH_WRITE_IMPORT' "$GITHUB_STEP_SUMMARY"
